<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <title>ArcoIris</title>
    <meta name="description" content="">
    <meta name="keywords" content="">
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <script>
        (function () {
            var t = localStorage.getItem('arco-iris-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/5.12.1/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ============================================
           主题变量：light / dark
           ============================================ */
        :root {
            --veil: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(8, 12, 16, 0.14);
            --row-tint: rgba(255, 255, 255, 0.06);
            --row-shadow: 0 34px 80px rgba(10, 20, 30, 0.30), 0 8px 22px rgba(10, 20, 30, 0.12);
            --head-shadow: rgba(255, 255, 255, 0.16);

            --text: #263640;
            --text-strong: #16242e;
            --text-mid: #1c3140;
            --text-name: #22323c;
            --text-soft: #142029;
            --text-halo: rgba(255, 255, 255, 0.78);

            --panel-bg: rgba(255, 255, 255, 0.24);
            --panel-border: rgba(255, 255, 255, 0.50);
            --panel-shadow: 0 4px 16px rgba(50, 72, 88, 0.07);
            --panel-halo: rgba(255, 255, 255, 0.55);

            --search-bg: rgba(255, 255, 255, 0.52);
            --search-border: rgba(255, 255, 255, 0.75);
            --search-focus-bg: rgba(255, 255, 255, 0.78);
            --search-text: #24333d;

            --hover-bg: rgba(255, 255, 255, 0.48);
            --chip-bg: rgba(255, 255, 255, 0.74);
            --chip-border: rgba(255, 255, 255, 0.84);
            --chip-text: #1b2a33;
        }

        html[data-theme="dark"] {
            --veil: rgba(6, 10, 14, 0.38);
            --card-bg: rgba(12, 16, 20, 0.52);
            --row-tint: rgba(255, 255, 255, 0.03);
            --row-shadow: 0 34px 80px rgba(0, 0, 0, 0.48), 0 8px 22px rgba(0, 0, 0, 0.26);
            --head-shadow: rgba(255, 255, 255, 0.08);

            --text: #dfe9ef;
            --text-strong: #f2f8fb;
            --text-mid: #d3e0e7;
            --text-name: #e2ecf2;
            --text-soft: #c6d4dc;
            --text-halo: rgba(0, 0, 0, 0.55);

            --panel-bg: rgba(255, 255, 255, 0.055);
            --panel-border: rgba(255, 255, 255, 0.10);
            --panel-shadow: 0 4px 18px rgba(0, 0, 0, 0.24);
            --panel-halo: rgba(255, 255, 255, 0.08);

            --search-bg: rgba(255, 255, 255, 0.10);
            --search-border: rgba(255, 255, 255, 0.14);
            --search-focus-bg: rgba(255, 255, 255, 0.16);
            --search-text: #eaf2f7;

            --hover-bg: rgba(255, 255, 255, 0.09);
            --chip-bg: rgba(255, 255, 255, 0.12);
            --chip-border: rgba(255, 255, 255, 0.18);
            --chip-text: #e4edf2;
        }

        /* ===== 背景 ===== */
        body {
            background-image:
                linear-gradient(var(--veil), var(--veil)),
                url(/Selenabj.jpg);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ===== 内容层 ===== */
        .card {
            opacity: 1 !important;
            background: var(--card-bg) !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            backdrop-filter: blur(4px) saturate(115%);
            -webkit-backdrop-filter: blur(4px) saturate(115%);
            color: var(--text);
            text-shadow: 0 1px 2px var(--text-halo);
            transition: background .3s ease, color .3s ease;
        }

        /* ===== 整体圆角卡 ===== */
        .row.my-card {
            display: flex;
            flex-wrap: nowrap;
            align-items: stretch;
            border-radius: 20px !important;
            overflow: hidden;
            background: var(--row-tint);
            box-shadow: var(--row-shadow), inset 0 1px 0 var(--head-shadow) !important;
            transition: box-shadow .3s ease, background .3s ease;
        }

        /* 照片：固定宽度，清零 col 内边距 */
        .row.my-card > .col-lg-4.photo-bg {
            position: relative;
            flex: 0 0 340px;
            width: 340px;
            max-width: 340px;
            padding: 0 !important;
            margin: 0 !important;
            background-image: url(/side.jpg) !important;
            background-position: 46% 12%;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* 照片底部渐隐进卡片，消除硬切线 */
        .row.my-card > .col-lg-4.photo-bg::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 72px;
            background: linear-gradient(to bottom,
                    rgba(8, 12, 16, 0) 0%,
                    var(--card-bg) 100%);
            pointer-events: none;
        }

        .row.my-card > .col-lg-8.card {
            flex: 1 1 auto;
            width: auto;
            max-width: none;
            padding: 44px 42px 40px !important;
        }

        /* ===== 搜索框 ===== */
        .searchBox {
            width: 84%;
            height: 42px;
            border: 1px solid var(--search-border);
            border-radius: 11px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: var(--search-bg);
            backdrop-filter: blur(6px) saturate(130%);
            -webkit-backdrop-filter: blur(6px) saturate(130%);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08), inset 0 1px 0 var(--panel-halo);
            transition: background .22s ease, box-shadow .22s ease, border-color .22s ease;
        }

        .searchBox:focus-within {
            background: var(--search-focus-bg);
            border-color: rgba(95, 158, 160, 0.65);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.10), 0 0 0 4px rgba(95, 158, 160, 0.16);
        }

        .inputBox {
            border: none;
            width: 84%;
            height: 40px;
            line-height: 40px;
            outline: none;
            padding-left: 16px;
            caret-color: #2b7a7d;
            font-size: 15px;
            color: var(--search-text);
            background: transparent;
            text-shadow: none;
            transition: color .3s ease;
        }

        .inputBox::placeholder { color: var(--text-mid); opacity: .5; }

        .searchBtn {
            width: 86px;
            height: 42px;
            border: none;
            position: absolute;
            right: 0;
            top: 0;
            outline: none;
            color: #fff;
            font-size: 14.5px;
            font-weight: 500;
            letter-spacing: .5px;
            background: rgba(95, 158, 160, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            transition: background .18s ease;
        }

        .searchBtn:hover { background: rgba(108, 175, 177, 0.96); }

        /* ===== 诗句 ===== */
        .poem {
            text-align: center;
            margin: 34px 0 30px;
        }

        .poem .en {
            display: block;
            font-family: Georgia, "Palatino Linotype", "Times New Roman", serif;
            font-style: italic;
            font-size: 17.5px;
            line-height: 1.8;
            color: var(--text-strong);
            font-weight: 700;
            letter-spacing: .3px;
            text-shadow: 0 1px 2px var(--text-halo);
            text-wrap: balance;          /* 多行时两端长度更接近，避免孤字成行 */
            transition: color .3s ease;
        }

        .poem .cn {
            display: block;
            font-family: "Kaiti SC", "KaiTi", "STKaiti", "楷体",
                         "FangSong", "STFangsong", "Songti SC", serif;
            font-size: 17.5px;
            line-height: 2.1;
            color: var(--text-mid);
            font-weight: 700;
            letter-spacing: 5px;
            margin-top: 5px;
            margin-bottom: 20px;
            text-shadow: 0 1px 2px var(--text-halo);
            transition: color .3s ease;
        }

        .poem .pair:last-child .cn { margin-bottom: 0; }

        /* ===== 导航面板 ===== */
        .nav-panel {
            position: relative;
            margin-top: 10px;
            padding: 16px 12px 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: var(--panel-shadow), inset 0 1px 0 var(--panel-halo);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: background .3s ease, border-color .3s ease;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 链接区：桌面由卡片剩余高度决定，超出内部滚动（分组后仍是一整块滚动） */
        #links {
            width: 100%;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #links::-webkit-scrollbar { display: none; }

        /* 可滚动时底部 10px 柔化：只消除硬切线，不遮住图标 */
        .nav-panel.is-scrollable #links {
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 10px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 10px), transparent 100%);
        }

        .nav-panel.is-scrollable.at-bottom #links {
            -webkit-mask-image: none;
            mask-image: none;
        }

        /* 右侧渐隐竖条：提示"这里还能滚"（底部让出 foot 按钮的位置） */
        .nav-panel.is-scrollable::before {
            content: '';
            position: absolute;
            right: 4px;
            top: 14px;
            bottom: 46px;
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(to bottom,
                    rgba(95, 158, 160, 0) 0%,
                    rgba(95, 158, 160, 0.65) 18%,
                    rgba(95, 158, 160, 0.65) 82%,
                    rgba(95, 158, 160, 0) 100%);
            pointer-events: none;
            transition: opacity .25s ease;
        }

        /* 滚到底：提示全部淡出 */
        .nav-panel.at-bottom::before { opacity: 0; }

        /* ===== 分组列表 ===== */
        .nav-groups {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 680px;
            margin: 0 auto;
            padding-bottom: 4px;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .nav-group + .nav-group { margin-top: 2px; }

        .group-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 6px;
            min-height: 15px;
        }

        .group-name {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.8px;
            color: var(--text-mid);
            opacity: .62;
            white-space: nowrap;
            outline: none;
            border-bottom: 1px solid transparent;
            transition: opacity .2s ease, border-color .2s ease;
        }

        .nav-group:hover .group-name { opacity: .85; }

        .group-name.editing {
            opacity: 1;
            border-bottom-color: rgba(95, 158, 160, 0.7);
            cursor: text;
        }

        .group-tools {
            display: flex;
            gap: 1px;
            opacity: 0;
            transition: opacity .2s ease;
        }

        .nav-group:hover .group-tools { opacity: 1; }

        .g-btn {
            width: 17px;
            height: 17px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--text-mid);
            opacity: .55;
            font-size: 11px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity .15s ease, background .15s ease;
        }

        .g-btn:hover { opacity: 1; background: var(--hover-bg); }

        .group-line {
            flex: 1 1 auto;
            height: 1px;
            background: linear-gradient(to right,
                    rgba(95, 158, 160, 0.20) 0%,
                    rgba(95, 158, 160, 0.02) 100%);
        }

        .group-count {
            font-size: 10.5px;
            color: var(--text-mid);
            opacity: .38;
            font-variant-numeric: tabular-nums;
        }

        /* 面板底部：新建分组 */
        .nav-panel-foot {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            padding-top: 10px;
        }

        .group-add {
            padding: 5px 16px;
            border: 1px dashed rgba(95, 158, 160, 0.5);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.22);
            color: var(--text-mid);
            font-size: 11.5px;
            letter-spacing: .5px;
            cursor: pointer;
            opacity: .85;
            transition: opacity .2s ease, border-color .2s ease, background .2s ease;
        }

        html[data-theme="dark"] .group-add { background: rgba(255, 255, 255, 0.06); }

        .group-add:hover {
            opacity: 1;
            border-color: rgba(95, 158, 160, 0.75);
            background: var(--hover-bg);
        }

        .group-new {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-new input {
            width: 120px;
            height: 24px;
            padding: 0 9px;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            background: var(--search-bg);
            color: var(--search-text);
            font-size: 11.5px;
            outline: none;
        }

        .group-new input::placeholder { color: var(--text-mid); opacity: .45; }

        .group-new button {
            height: 24px;
            padding: 0 10px;
            border: none;
            border-radius: 999px;
            font-size: 11.5px;
            cursor: pointer;
            background: rgba(95, 158, 160, 0.85);
            color: #fff;
        }

        .group-new button.ghost {
            background: transparent;
            color: var(--text-mid);
            opacity: .6;
        }

        /* ===== 导航：按行分组 ===== */
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 0;
        }

        /* 空分组 = 拖拽落点 */
        .nav-row.empty {
            min-height: 74px;
            align-items: center;
            border: 1px dashed rgba(95, 158, 160, 0.28);
            border-radius: 12px;
        }

        .nav-row.empty::after {
            content: '拖到这里';
            font-size: 11.5px;
            letter-spacing: 1px;
            color: var(--text-mid);
            opacity: .38;
        }

        .drag-ghost { opacity: .32; }

        .nav-item.dragging { cursor: grabbing; }

        .nav-item {
            flex: 1 1 0;
            min-width: 0;
            max-width: 98px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            padding: 12px 4px 10px;
            border-radius: 12px;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }

        .nav-item:hover {
            background: var(--hover-bg);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .nav-item:focus-visible {
            outline: 2px solid rgba(95, 158, 160, 0.7);
            outline-offset: 2px;
        }

        /* ===== 图标 ===== */
        .nav-icon {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            background-color: var(--c, #3385ff);
            background-image: linear-gradient(168deg,
                    rgba(255, 255, 255, 0.22) 0%,
                    rgba(255, 255, 255, 0.03) 40%,
                    rgba(0, 0, 0, 0.10) 100%);
            filter: saturate(0.70) brightness(1.02);
            box-shadow:
                0 6px 16px -2px rgba(0, 0, 0, 0.28),
                0 2px 5px rgba(0, 0, 0, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 -1px 0 rgba(0, 0, 0, 0.06);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.20);
            transition: box-shadow .2s ease, filter .2s ease, transform .2s ease;
        }

        .nav-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .nav-icon i { font-size: 19px; line-height: 1; }

        .nav-item:hover .nav-icon {
            filter: saturate(0.86) brightness(1.05);
            transform: translateY(-3px);
            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.34),
                0 18px 34px -4px rgba(0, 0, 0, 0.38),
                0 4px 10px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.32);
        }

        /* ===== 状态点 ===== */
        .nav-icon .dot {
            position: absolute;
            right: 1px;
            top: 1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5fd39a;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.92);
        }

        .nav-icon .dot.off { background: #ef7f79; }
        .nav-icon .dot.unknown { background: rgba(255, 255, 255, 0.45); }

        .nav-name {
            font-size: 13.5px;
            line-height: 1.35;
            color: var(--text-name);
            font-weight: 500;
            text-align: center;
            word-break: break-word;
            max-width: 100%;
            transition: color .3s ease;
        }

        /* ===== 右下角浮动按钮 ===== */
        .dock {
            position: fixed;
            right: 18px;
            bottom: calc(env(safe-area-inset-bottom) + 16px);
            display: flex;
            align-items: center;
            gap: 9px;
            z-index: 20;
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            color: var(--chip-text);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(40, 70, 95, 0.16);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background .2s ease, color .2s ease, transform .2s ease;
        }

        .theme-toggle:hover { transform: rotate(-18deg); }

        /* 内联 SVG：不依赖字体，跨平台一致 */
        .theme-toggle svg,
        .admin-entry svg {
            width: 17px;
            height: 17px;
            flex: 0 0 auto;
        }

        .theme-toggle svg.ico-moon,
        .admin-entry svg.ico-moon,
        .theme-btn svg.ico-moon { display: none; }

        html[data-theme="dark"] .theme-toggle svg.ico-sun,
        html[data-theme="dark"] .admin-entry svg.ico-sun,
        html[data-theme="dark"] .theme-btn svg.ico-sun { display: none; }

        html[data-theme="dark"] .theme-toggle svg.ico-moon,
        html[data-theme="dark"] .admin-entry svg.ico-moon,
        html[data-theme="dark"] .theme-btn svg.ico-moon { display: block; }

        .admin-entry {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--chip-text);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(40, 70, 95, 0.16);
            text-decoration: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background .2s ease, color .2s ease, box-shadow .2s ease, transform .2s ease;
        }

        .admin-entry:hover {
            background: #5f9ea0;
            color: #fff;
            box-shadow: 0 8px 20px rgba(40, 70, 95, 0.24);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .card h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-soft);
            letter-spacing: 4px;
            margin-top: 30px !important;
            text-shadow: none;
            transition: color .3s ease;
        }

        /* ===== 页脚（在卡片内，成为卡片下沿） ===== */
        .footer {
            margin-top: 26px;
            padding-top: 16px;
            border-top: 1px solid rgba(95, 158, 160, 0.14);
            text-align: center;
        }

        .footer,
        .footer p,
        .footer a {
            color: var(--text-soft) !important;
            font-weight: 500;
            text-shadow: 0 1px 2px var(--text-halo);
        }

        .footer p {
            margin: 0;
            font-size: 12px;
            letter-spacing: .5px;
        }

        /* 保存成功：面板边沿轻微闪一下 */
        .nav-panel.just-saved {
            border-color: rgba(95, 158, 160, 0.55) !important;
            box-shadow: var(--panel-shadow), 0 0 0 3px rgba(95, 158, 160, 0.12),
                        inset 0 1px 0 var(--panel-halo) !important;
        }

        .nav-toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 10px);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 12.5px;
            letter-spacing: .4px;
            color: #fff;
            background: rgba(22, 34, 42, 0.86);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity .25s ease, transform .25s ease;
        }

        .nav-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ===== 磨砂降级 ===== */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card { background: var(--card-bg) !important; }
            .searchBox { background: var(--search-bg); }
            .nav-panel { background: var(--panel-bg); }
        }

        /* ===== 桌面：卡片有宽高上限 =====
           目的：① 高度不再随服务数量变化 → 左侧照片 cover 的裁切范围恒定；
                ② 大屏也不再拉成"宽扁横条"——宽度和高度都有上限，
                   保持窄长卡的比例（约 900 × 760），导航区约 3 行、超出内滚。 */
        @media (min-width: 992px) {
            body {
                height: 100dvh;
                min-height: 0;
                overflow: hidden;
            }

            .row.my-card {
                height: auto;
                max-width: 980px;
                max-height: calc(100dvh - 26px);
                margin-left: auto;
                margin-right: auto;
            }

            .row.my-card > .col-lg-8.card {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            /* 不 grow：卡片高度由内容决定；空间不足时允许收缩并内滚 */
            .nav-panel {
                flex: 0 1 auto;
                min-height: 0;
            }

            /* 可见约 3 行（97×3 + 组间 gap），再多就滚动 */
            #links { max-height: 330px; }

            .searchBox,
            .poem,
            .card h4,
            .footer { flex: 0 0 auto; }

            /* 桌面把上方留白收紧，把高度让给导航区 */
            .poem { margin: 14px 0 12px; }
            .poem .en { line-height: 1.65; }
            .poem .cn { line-height: 1.85; margin-top: 3px; margin-bottom: 11px; }
            .card h4 { margin-top: 15px !important; }
            .footer { margin-top: 11px; padding-top: 9px; }
        }

        /* ===== 平板及以下 ===== */
        @media (max-width: 991px) {
            .row.my-card {
                flex-wrap: wrap;
                border-radius: 18px !important;
            }

            .row.my-card > .col-lg-4.photo-bg {
                flex: 0 0 100%;
                width: 100%;
                max-width: 100%;
                height: 210px;
                min-height: 210px;      /* 压掉原 style.css 的 calc(90vh - 440px) */
                background-image: url(/Selena.jpg) !important;
                background-position: center 26%;
                background-size: cover;
            }

            .row.my-card > .col-lg-8.card {
                flex: 1 1 100%;
                width: 100%;
                padding: 34px 30px 32px !important;
            }

            .searchBox { width: 92%; }
        }

        /* ===== 手机 ===== */
        @media (max-width: 767px) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }

            #main.container {
                padding-left: 10px;
                padding-right: 10px;
                padding-bottom: calc(env(safe-area-inset-bottom) + 22px);
            }

            .row.my-card {
                border-radius: 16px !important;
                margin: 10px 0 !important;
            }

            .row.my-card > .col-lg-4.photo-bg {
                height: 148px;
                min-height: 148px;
                background-position: center 22%;
            }

            .card { padding: 20px 15px 22px !important; }

            .searchBox { width: 100%; }

            .poem { margin: 20px 0 18px; }
            .poem .en { font-size: 14.5px; line-height: 1.7; }
            .poem .cn {
                font-size: 14px;
                letter-spacing: 2.5px;
                line-height: 1.95;
                margin-bottom: 12px;
            }

            .nav-panel { padding: 14px 8px 8px; border-radius: 14px; }
            .nav-grid { gap: 26px; max-width: 100%; }
            .nav-row { gap: 6px; }
            .nav-item {
                flex: 1 1 0;
                min-width: 0;
                max-width: 76px;
                gap: 7px;
                padding: 10px 2px 8px;
            }
            .nav-icon { width: 42px; height: 42px; border-radius: 12px; font-size: 17px; }
            .nav-icon i { font-size: 17px; }
            .nav-name { font-size: 12.5px; }

            .card h4 { margin-top: 20px !important; font-size: 12px; letter-spacing: 2px; }

            /* 手机上：右下角浮窗（离边缘留一点，不贴死） */
            .dock {
                position: fixed;
                right: 14px;
                bottom: calc(env(safe-area-inset-bottom) + 76px);
                left: auto;
                top: auto;
                transform: none;
                flex-direction: column;

            .admin-entry .txt { display: none; }
        }

<body>

    <script>
        /* ===== 主题 ===== */
        var root = document.documentElement;

        function applyTheme(t) {
            root.setAttribute('data-theme', t);
            localStorage.setItem('arco-iris-theme', t);
        }

        document.getElementById('themeBtn').onclick = function () {
            applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        };

        applyTheme(root.getAttribute('data-theme') || 'light');
        /* ===== 页面文案（诗歌 / 签名），后台可改 ===== */
        function applySettings(s) {
            function set(id, v) {
                var el = document.getElementById(id);
                if (el && v !== undefined && v !== null && v !== '') el.textContent = v;
            }
            set('poemEn1', s.poem_en_1);
            set('poemCn1', s.poem_cn_1);
            set('poemEn2', s.poem_en_2);
            set('poemCn2', s.poem_cn_2);
            set('signature', s.signature);

            /* 第二组诗留空 → 整组隐藏 */
            var p2 = document.getElementById('pair2');
            if (p2 && !s.poem_en_2 && !s.poem_cn_2) p2.style.display = 'none';
        }

        /* ===== 基础工具 ===== */
        function esc(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function initialOf(name) {
            var t = (name || '').trim();
            if (!t) return '?';
            var c = t.charAt(0);
            return /[a-z]/.test(c) ? c.toUpperCase() : c;
        }

        function originOf(u) {
            try {
                var p = new URL(u, location.origin);
                return p.origin;
            } catch (e) { return ''; }
        }

        /* favicon 加载失败 → 退回首字母 */
        window.iconFail = function (img) {
            var ini = img.getAttribute('data-ini') || '?';
            var sp = document.createElement('span');
            sp.textContent = ini;
            img.parentNode.replaceChild(sp, img);
        };

        function iconHtml(s) {
            var ic = (s.icon || '').trim();
            var ini = initialOf(s.name);

            /* Font Awesome 类名 */
            if (ic.indexOf('fa-') === 0 || /^fa[srb] /.test(ic)) {
                var cls = ic.indexOf('fa-') === 0 ? 'fas ' + ic : ic;
                return '<i class="' + esc(cls) + '"></i>';
            }

            var src = '';
            if (/^(https?:\/\/|\/)/.test(ic)) {
                src = ic;                       /* 自定义图片 / 上传的文件 */
            } else {
                var o = originOf(s.url);        /* 未设置 → 自动取网站 favicon */
                if (o) src = o + '/favicon.ico';
            }

            if (src) {
                return '<img src="' + esc(src) + '" data-ini="' + esc(ini) +
                    '" alt="" onerror="iconFail(this)">';
            }
            return esc(ini);
        }

        function itemHtml(s, status) {
            var st = status && (s.id in status) ? (status[s.id] ? '' : ' off') : ' unknown';
            return '<a href="' + esc(s.url) + '" class="nav-item" data-id="' + s.id + '" target="_blank" title="' + esc(s.name) + '">' +
                '<span class="nav-icon" style="--c:' + esc(s.color) + '">' +
                iconHtml(s) +
                '<i class="dot' + st + '"></i>' +
                '</span>' +
                '<span class="nav-name">' + esc(s.name) + '</span>' +
                '</a>';
        }

        /* 一行放几个：用面板宽度算（不能用 #links —— 它的宽度由内容决定，
           拿去算列数会形成"自己算自己"的死循环，最终锁死在最小值） */
        function perRowCount() {
            var panel = document.querySelector('.nav-panel');
            var w = panel ? panel.clientWidth - 24 : 0;
            if (w <= 0) {
                var card = document.querySelector('.card');
                w = card ? card.clientWidth - 90 : 480;
            }
            var unit = window.innerWidth <= 767 ? 82 : 100;
            return Math.floor(w / unit);
        }

        /* n 个元素尽量均分到若干行 */
        function rowsOf(n, max) {
            if (n <= max) return [n];
            var rows = Math.ceil(n / max);
            var base = Math.floor(n / rows);
            var rem = n % rows;
            var out = [];
            for (var i = 0; i < rows; i++) out.push(base + (i < rem ? 1 : 0));
            return out;
        }

        /* ===== 全局状态：服务端为唯一真理 ===== */
        var _list = [];
        var _status = null;
        var _groups = [];

        function groupKeyOf(s) {
            return (s.group_id === null || s.group_id === undefined) ? '' : String(s.group_id);
        }

        /* 把扁平服务列表按分组拆开；找不到组的 → 未分组 */
        function buildGroups() {
            var out = [], byKey = {};
            _groups.forEach(function (g) {
                var node = { gid: String(g.id), name: g.name, items: [] };
                byKey[node.gid] = node;
                out.push(node);
            });
            var loose = { gid: '', name: '未分组', items: [] };
            _list.forEach(function (s) {
                var k = groupKeyOf(s);
                (k && byKey[k] ? byKey[k] : loose).items.push(s);
            });
            /* 只要存在真实分组，就保留「未分组」作为拖出落点（即使当前为空）；
               完全没有分组时也保留它，但渲染时隐藏组头（回到原来的纯网格视觉） */
            if (loose.items.length || _groups.length) out.push(loose);
            return out;
        }

        function groupHtml(g, status) {
            var max = Math.max(2, Math.min(6, perRowCount()));
            var counts = rowsOf(g.items.length, max);
            var idx = 0;
            var rows = counts.map(function (c) {
                var row = g.items.slice(idx, idx + c);
                idx += c;
                return '<div class="nav-row' + (row.length ? '' : ' empty') + '">' +
                    row.map(function (s) { return itemHtml(s, status); }).join('') +
                    '</div>';
            }).join('');

            var tools = g.gid
                ? '<span class="group-tools">' +
                    '<button type="button" class="g-btn" data-act="rename" data-gid="' + g.gid + '" title="重命名">✎</button>' +
                    '<button type="button" class="g-btn" data-act="del" data-gid="' + g.gid + '" title="删除分组">✕</button>' +
                  '</span>'
                : '';

            /* 没有自定义分组时，不显示「未分组」这行标题，视觉和原来一致 */
            var head = (g.gid === '' && _groups.length === 0) ? '' :
                '<div class="group-head">' +
                    '<span class="group-name" data-gid="' + g.gid + '">' + esc(g.name) + '</span>' +
                    tools +
                    '<span class="group-line"></span>' +
                    '<span class="group-count">' + g.items.length + '</span>' +
                '</div>';

            return '<section class="nav-group' + (head ? '' : ' no-head') + '" data-gid="' + g.gid + '">' +
                head + rows +
                '</section>';
        }

        function render(status) {
            var box = document.getElementById('groupBox');
            if (!box) return;

            var gs = buildGroups();
            if (!gs.length) {
                box.innerHTML = '<span style="color:#95a5a6;font-size:13px">还没有服务，点右下角「管理」添加</span>';
                return;
            }

            box.innerHTML = gs.map(function (g) { return groupHtml(g, status); }).join('');
            bindGroupTools();
            initDrag();
            applyScrollState();
        }

        /* 桌面由卡片高度决定可视区，这里只切换"可滚动"提示；
           手机/平板不再限制行数，整页自然滚动 */
        function applyScrollState() {
            var box = document.getElementById('links');
            if (!box) return;
            var panel = box.parentNode;
            if (!panel) return;

            panel.classList.remove('is-scrollable', 'at-bottom');

            box.onscroll = function () {
                var atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
                panel.classList.toggle('at-bottom', atBottom);
            };

            /* 等一帧让新写入的 DOM 完成布局，否则量到的是旧高度 */
            requestAnimationFrame(function () {
                var over = box.scrollHeight > box.clientHeight + 2;
                panel.classList.toggle('is-scrollable', over);
            });
        }

        /* ===== 拖拽：组内排序 + 跨组归属 ===== */
        function initDrag() {
            if (!window.Sortable) return;
            Array.prototype.forEach.call(document.querySelectorAll('.nav-row'), function (row) {
                if (row._sortable) return;
                row._sortable = Sortable.create(row, {
                    group: 'nav-items',
                    animation: 150,
                    delay: 150,
                    delayOnTouchOnly: true,
                    draggable: '.nav-item',
                    ghostClass: 'drag-ghost',
                    onEnd: function () { saveLayout(); }
                });
            });
        }

        function collectLayout() {
            var items = [];
            Array.prototype.forEach.call(document.querySelectorAll('.nav-group'), function (sec) {
                var gid = sec.getAttribute('data-gid') || '';
                Array.prototype.forEach.call(sec.querySelectorAll('.nav-item[data-id]'), function (el, i) {
                    items.push({
                        id: parseInt(el.getAttribute('data-id'), 10),
                        group_id: gid ? parseInt(gid, 10) : null,
                        sort: i * 10
                    });
                });
            });
            return items;
        }

        var _saving = null;

        function saveLayout() {
            var items = collectLayout();
            var byId = {};
            items.forEach(function (it) { byId[it.id] = it; });

            /* 先更新本地状态并重排（让每行数量重新均分） */
            _list.forEach(function (s) {
                var it = byId[s.id];
                if (it) { s.group_id = it.group_id; s.sort = it.sort; }
            });
            _list.sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
            render(_status);

            fetch('/api/layout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Nav-Edit': '1' },
                body: JSON.stringify({ items: items })
            }).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                flashSaved();
            }).catch(function () {
                toast('保存失败，重新加载');
                loadAll();
            });
        }

        function flashSaved() {
            var panel = document.querySelector('.nav-panel');
            if (!panel) return;
            panel.classList.add('just-saved');
            clearTimeout(_saving);
            _saving = setTimeout(function () { panel.classList.remove('just-saved'); }, 900);
        }

        /* ===== 分组操作（免登录，带 X-Nav-Edit） ===== */
        function apiGroups(method, gid, payload) {
            var url = '/api/groups' + (gid ? '/' + gid : '');
            return fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'X-Nav-Edit': '1' },
                body: payload ? JSON.stringify(payload) : undefined
            }).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            });
        }

        function bindGroupTools() {
            Array.prototype.forEach.call(document.querySelectorAll('.g-btn'), function (btn) {
                btn.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var gid = parseInt(btn.getAttribute('data-gid'), 10);
                    if (btn.getAttribute('data-act') === 'del') {
                        if (!confirm('删除这个分组？组内服务会回到「未分组」')) return;
                        apiGroups('DELETE', gid).then(function () {
                            _groups = _groups.filter(function (g) { return g.id !== gid; });
                            _list.forEach(function (s) { if (s.group_id === gid) s.group_id = null; });
                            render(_status);
                        }).catch(function () { toast('删除失败'); });
                    } else {
                        startRename(gid);
                    }
                };
            });
        }

        function startRename(gid) {
            var el = document.querySelector('.group-name[data-gid="' + gid + '"]');
            if (!el) return;

            var old = el.textContent;
            el.setAttribute('contenteditable', 'true');
            el.classList.add('editing');
            el.focus();

            var r = document.createRange();
            r.selectNodeContents(el);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);

            var finished = false;

            function done(save) {
                if (finished) return;
                finished = true;
                el.removeAttribute('contenteditable');
                el.classList.remove('editing');

                var val = (el.textContent || '').trim().slice(0, 40);
                if (!save || !val || val === old) {
                    el.textContent = old;
                    return;
                }
                el.textContent = val;
                apiGroups('PUT', gid, { name: val }).then(function () {
                    _groups.forEach(function (g) { if (g.id === gid) g.name = val; });
                }).catch(function () {
                    el.textContent = old;
                    toast('重命名失败');
                });
            }

            el.onblur = function () { done(true); };
            el.onkeydown = function (ev) {
                if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
                else if (ev.key === 'Escape') { ev.preventDefault(); done(false); }
            };
        }

        /* ===== 轻提示 ===== */
        function toast(msg) {
            var t = document.createElement('div');
            t.className = 'nav-toast';
            t.textContent = msg;
            document.body.appendChild(t);
            requestAnimationFrame(function () { t.classList.add('show'); });
            setTimeout(function () {
                t.classList.remove('show');
                setTimeout(function () { t.remove(); }, 300);
            }, 2000);
        }

        /* ===== 新建分组 ===== */
        (function initGroupAdd() {
            var addBtn = document.getElementById('groupAdd');
            var form = document.getElementById('groupNew');
            var input = document.getElementById('groupNewName');
            var cancel = document.getElementById('groupNewCancel');
            if (!addBtn || !form) return;

            addBtn.onclick = function () {
                addBtn.hidden = true;
                form.hidden = false;
                input.value = '';
                input.focus();
            };

            cancel.onclick = function () {
                form.hidden = true;
                addBtn.hidden = false;
            };

            form.onsubmit = function (e) {
                e.preventDefault();
                var name = input.value.trim();
                if (!name) return;
                apiGroups('POST', null, { name: name }).then(function (g) {
                    _groups.push(g);
                    form.hidden = true;
                    addBtn.hidden = false;
                    render(_status);
                    var el = document.querySelector('.nav-group[data-gid="' + g.id + '"]');
                    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }).catch(function () { toast('创建失败'); });
            };
        })();

        /* ===== 加载 ===== */
        function loadAll() {
            return Promise.all([
                fetch('/api/services').then(function (r) { return r.json(); }),
                fetch('/api/groups').then(function (r) { return r.json(); }),
                fetch('/api/settings').then(function (r) { return r.json(); }).catch(function () { return {}; })
            ]).then(function (res) {
                _list = res[0] || [];
                _groups = res[1] || [];
                applySettings(res[2] || {});
                render(null);
                return fetch('/api/status').then(function (r) { return r.json(); });
            }).then(function (st) {
                _status = st;
                render(_status);
            }).catch(function () {
                document.getElementById('groupBox').innerHTML =
                    '<span style="color:#e74c3c;font-size:13px">加载服务列表失败</span>';
            });
        }

        window.addEventListener('resize', function () {
            clearTimeout(window._rt);
            window._rt = setTimeout(function () {
                if (_list.length) render(_status);
            }, 180);
        });

        loadAll();
    </script>
</body>

</html>
