<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>管理 · ArcoIris</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/5.12.1/css/all.min.css">
    <script>
        /* 首屏前应用主题，避免闪白 */
        (function () {
            var t = localStorage.getItem('arco-iris-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        * { box-sizing: border-box; }

        :root {
            --veil: rgba(255, 255, 255, 0.16);
            --card-bg: rgba(255, 255, 255, 0.42);
            --card-border: rgba(255, 255, 255, 0.55);
            --card-shadow: 0 20px 46px rgba(30, 52, 68, 0.12);
            --text: #1f2f39;
            --text-dim: #5c7078;
            --text-soft: #7d909a;
            --input-bg: rgba(255, 255, 255, 0.56);
            --input-border: rgba(255, 255, 255, 0.80);
            --input-focus-bg: rgba(255, 255, 255, 0.86);
            --divider: rgba(95, 158, 160, 0.16);
            --accent: #5f9ea0;
            --accent-hover: #4f8b8d;
            --accent-shadow: rgba(60, 100, 105, 0.22);
            --danger: #a7392f;
            --ghost-bg: rgba(255, 255, 255, 0.62);
            --ghost-border: rgba(255, 255, 255, 0.85);
            --item-bg: rgba(255, 255, 255, 0.30);
            --item-border: rgba(255, 255, 255, 0.46);
        }

        html[data-theme="dark"] {
            --veil: rgba(8, 12, 16, 0.56);
            --card-bg: rgba(22, 28, 34, 0.62);
            --card-border: rgba(255, 255, 255, 0.10);
            --card-shadow: 0 20px 46px rgba(0, 0, 0, 0.42);
            --text: #e4edf2;
            --text-dim: #9db0bb;
            --text-soft: #7f929d;
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus-bg: rgba(255, 255, 255, 0.13);
            --divider: rgba(255, 255, 255, 0.08);
            --accent: #67a8aa;
            --accent-hover: #79bcbe;
            --accent-shadow: rgba(0, 0, 0, 0.36);
            --danger: #e0837b;
            --ghost-bg: rgba(255, 255, 255, 0.08);
            --ghost-border: rgba(255, 255, 255, 0.14);
            --item-bg: rgba(255, 255, 255, 0.045);
            --item-border: rgba(255, 255, 255, 0.09);
        }

        body {
            margin: 0;
            padding: 24px 18px calc(env(safe-area-inset-bottom) + 48px);
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #ebf1f5;
            background-image:
                linear-gradient(var(--veil), var(--veil)),
                url(/Selenabj.jpg);
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                         system-ui, -apple-system, sans-serif;
            color: var(--text);
            transition: color .25s ease;
        }

        .wrap { max-width: 980px; margin: 0 auto; }

        /* ===== 顶栏 ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            padding: 14px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: background .25s ease, border-color .25s ease;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text);
        }

        header .sub {
            font-family: "Kaiti SC", "KaiTi", "STKaiti", "楷体", serif;
            font-size: 12.5px;
            letter-spacing: 3px;
            color: var(--text-soft);
            margin-left: 10px;
        }

        .head-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .links a {
            font-size: 13px;
            color: var(--text-dim);
            text-decoration: none;
            transition: color .18s ease;
        }

        .links a:hover { color: var(--accent); text-decoration: none; }

        /* 主题切换 */
        .theme-btn {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            color: var(--text-dim);
            background: var(--ghost-bg);
            border: 1px solid var(--ghost-border);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(30, 52, 68, 0.10);
            transition: transform .2s ease, color .2s ease, background .2s ease;
        }

        .theme-btn:hover { transform: rotate(-18deg); color: var(--accent); }

        .theme-btn svg {
            width: 16px;
            height: 16px;
        }

        .theme-toggle svg.ico-moon,
        .admin-entry svg.ico-moon,
        .theme-btn svg.ico-moon { display: none; }

        html[data-theme="dark"] .theme-toggle svg.ico-sun,
        html[data-theme="dark"] .admin-entry svg.ico-sun,
        html[data-theme="dark"] .theme-btn svg.ico-sun { display: none; }

        html[data-theme="dark"] .theme-toggle svg.ico-moon,
        html[data-theme="dark"] .admin-entry svg.ico-moon,
        html[data-theme="dark"] .theme-btn svg.ico-moon { display: block; }

        /* ===== 卡片 ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 18px 20px 16px;
            margin-bottom: 16px;
            transition: background .25s ease, border-color .25s ease;
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 3px;
        }

        /* ===== 添加行 ===== */
        .add-row {
            display: grid;
            grid-template-columns: 42px 1.1fr 1.9fr 110px auto;
            gap: 9px;
            align-items: center;
        }

        /* ===== 文案设置 ===== */
        .settings-grid {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 9px 12px;
            align-items: center;
        }

        .settings-grid label {
            font-size: 12.5px;
            color: var(--text-soft);
            letter-spacing: .5px;
        }

        .settings-grid input {
            width: 100%;
            padding: 9px 11px;
            font-size: 13px;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 9px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .settings-grid input:focus {
            background: var(--input-focus-bg);
            border-color: rgba(95, 158, 160, 0.62);
            box-shadow: 0 0 0 3px rgba(95, 158, 160, 0.14);
        }

        input[type=text], input[type=url] {
            width: 100%;
            padding: 9px 11px;
            font-size: 13px;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 9px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
        }

        input[type=text]::placeholder,
        input[type=url]::placeholder { color: var(--text-soft); opacity: .8; }

        input[type=text]:focus, input[type=url]:focus {
            background: var(--input-focus-bg);
            border-color: rgba(95, 158, 160, 0.62);
            box-shadow: 0 0 0 3px rgba(95, 158, 160, 0.14);
        }

        input[type=color] {
            -webkit-appearance: none;
            appearance: none;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(20, 40, 55, 0.16);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        input[type=color]:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(20, 40, 55, 0.22);
        }

        input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }

        input[type=color]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        input[type=color]::-moz-color-swatch {
            border: none;
            border-radius: 50%;
        }

        /* 图标字段：预览 + 输入框 + 上传钮 */
        .icon-field {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-field input { flex: 1 1 auto; min-width: 0; }

        .icon-preview {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            background-color: var(--c, #3385ff);
            background-image: linear-gradient(160deg,
                    rgba(255, 255, 255, 0.20),
                    rgba(0, 0, 0, 0.10));
            border-radius: 9px;
            overflow: hidden;
            box-shadow:
                0 2px 6px rgba(20, 40, 55, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.24);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .icon-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== 按钮 ===== */
        button {
            padding: 9px 15px;
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: .5px;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px var(--accent-shadow);
            transition: background .18s ease, box-shadow .18s ease, transform .15s ease;
        }

        button:hover { background: var(--accent-hover); box-shadow: 0 7px 18px var(--accent-shadow); }
        button:active { transform: translateY(1px); }

        /* 图标按钮 */
        .ibtn {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 14px;
            line-height: 1;
            color: var(--text-dim);
            background: var(--ghost-bg);
            border: 1px solid var(--ghost-border);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(30, 52, 68, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .ibtn:hover {
            color: var(--accent);
            background: var(--input-focus-bg);
        }

        .ibtn.save {
            color: #fff;
            background: var(--accent);
            border-color: transparent;
        }

        .ibtn.save:hover { background: var(--accent-hover); color: #fff; }

        .ibtn.del { color: var(--danger); }
        .ibtn.del:hover { background: rgba(224, 131, 123, 0.16); }

        /* ===== 表格 ===== */
        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-soft);
            letter-spacing: 1px;
            padding: 7px 8px;
            border-bottom: 1px solid var(--divider);
        }

        td {
            padding: 8px;
            border-bottom: 1px solid var(--divider);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: 0; }

        .ops { display: flex; gap: 5px; align-items: center; }

        .color-cell { width: 42px; padding-left: 0; }
        .name-cell { width: 17%; }
        .url-cell { width: 36%; }
        .icon-cell { width: 15%; }
        .op-cell { width: 190px; padding-right: 0; text-align: right; }
        .op-cell .ops { justify-content: flex-end; }

        .disabled-row { opacity: .42; }

        /* ===== 提示 ===== */
        .hint {
            font-size: 12px;
            color: var(--text-soft);
            margin: 12px 0 0;
            line-height: 1.7;
        }

        .hint code {
            padding: 1px 5px;
            font-size: 11.5px;
            color: var(--text-dim);
            background: var(--input-bg);
            border-radius: 4px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(14px);
            padding: 10px 22px;
            font-size: 13px;
            color: #fff;
            background: rgba(46, 70, 79, 0.94);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(20, 40, 50, 0.32);
            opacity: 0;
            transition: all .25s ease;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            body { padding: 14px 10px calc(env(safe-area-inset-bottom) + 40px); }

            /* 内容整体居中，两侧留出背景 */
            .wrap { max-width: 560px; margin: 0 auto; }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 14px 16px;
            }

            .head-right { width: 100%; justify-content: space-between; }

            .add-row { grid-template-columns: 42px 1fr; gap: 8px; }
            .add-row > *:nth-child(2),
            .add-row > *:nth-child(3),
            .add-row > *:nth-child(4) { grid-column: 1 / -1; }

            /* 添加按钮整行撑满 */
            .add-row > button {
                grid-column: 1 / -1;
                width: 100%;
                padding: 11px;
                font-size: 14px;
            }

            .card { padding: 15px 13px; border-radius: 14px; }

            /* 表格转卡片列表 */
            table, thead, tbody { display: block; width: 100%; }
            thead { display: none; }

            tr {
                position: relative;
                display: block;
                margin-bottom: 12px;
                padding: 14px 15px 12px;
                background: var(--item-bg);
                border: 1px solid var(--item-border);
                border-radius: 12px;
            }

            tr:last-child { margin-bottom: 0; }

            td {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 5px 0;
                border: 0;
                width: auto !important;
            }

            td::before {
                content: attr(data-label);
                flex: 0 0 40px;
                font-size: 11.5px;
                letter-spacing: .5px;
                color: var(--text-soft);
            }

            /* 色点挪到卡片右上角，不再单独占一行 */
            td.color-cell {
                position: absolute;
                top: 13px;
                right: 14px;
                padding: 0;
                width: auto !important;
            }
            td.color-cell::before { content: none; }

            /* 名称行右侧留出圆点的位置，避免重叠 */
            td.name-cell { padding-right: 44px; }
            td.name-cell input { padding-right: 8px; }

            /* 操作按钮单独一行，上方虚线分隔 */
            .op-cell {
                margin-top: 8px;
                padding-top: 10px;
                border-top: 1px dashed var(--divider);
            }
            .op-cell::before { content: none; }
            .op-cell .ops { justify-content: flex-start; gap: 8px; }

            .ibtn { width: 36px; height: 36px; font-size: 15px; }
        }

        /* ===== 拖拽排序 ===== */
        .drag-handle {
            cursor: grab;
            font-size: 15px;
            color: var(--text-soft);
            padding: 0 2px;
            user-select: none;
            -webkit-user-select: none;
            transition: color .15s ease;
        }

        .drag-handle:hover { color: var(--accent); }

        .sortable-ghost {
            opacity: 0.35;
            background: rgba(95, 158, 160, 0.14) !important;
        }

        .sortable-chosen .drag-handle { cursor: grabbing; color: var(--accent); }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>

<body>
    <div class="wrap">
        <header>
            <div>
                <h1>服务管理</h1><span class="sub">ArcoIris</span>
            </div>
            <div class="head-right">
                <div class="links">
                    <a href="/" target="_blank">查看导航页 →</a>
                    <a href="/logout" style="margin-left:14px">退出</a>
                </div>
                <button class="theme-btn" id="themeBtn" title="切换主题">
                    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2.6v2M12 19.4v2M4.2 12h-2M21.8 12h-2M6.5 6.5 5.1 5.1M18.9 18.9l-1.4-1.4M17.5 6.5l1.4-1.4M5.1 18.9l1.4-1.4"/>
                    </svg>
                    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.7 8.7 0 1 0 10.8 10.8Z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="card">
            <h2>添加服务</h2>
            <div class="add-row">
                <input type="color" id="newColor" value="#3385ff">
                <input type="text" id="newName" placeholder="名称，如 Komga">
                <input type="url" id="newUrl" placeholder="地址，如 http://192.168.5.105:25600/">
                <input type="text" id="newIcon" placeholder="图标（可选）">
                <button id="btnAdd">添加</button>
            </div>
            <p class="hint">
                图标可填 Font Awesome 类名（<code>fa-book</code>）、图片地址（<code>http://…</code>），留空显示首字。
            </p>
        </div>

        <div class="card">
            <h2>页面文案</h2>
            <div class="settings-grid">
                <label>诗一 · 英文</label>
                <input type="text" id="set_poem_en_1" placeholder="Shall I compare thee...">
                <label>诗一 · 中文</label>
                <input type="text" id="set_poem_cn_1" placeholder="我可否将你比作一个夏日">
                <label>诗二 · 英文</label>
                <input type="text" id="set_poem_en_2" placeholder="留空则只显示一组">
                <label>诗二 · 中文</label>
                <input type="text" id="set_poem_cn_2" placeholder="留空则只显示一组">
                <label>签名</label>
                <input type="text" id="set_signature" placeholder="他山之石，可以攻玉">
            </div>
            <button id="btnSaveSettings" style="margin-top:14px">保存文案</button>
        </div>

        <div class="card">
            <h2>已有服务</h2>
            <table>
                <thead>
                    <tr>
                        <th class="color-cell">色</th>
                        <th class="name-cell">名称</th>
                        <th class="url-cell">地址</th>
                        <th class="icon-cell">图标</th>
                        <th class="op-cell">操作</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ===== 主题 ===== */
        var root = document.documentElement;

        function applyTheme(t) {
            root.setAttribute('data-theme', t);
            localStorage.setItem('arco-iris-theme', t);
        }

        document.getElementById('themeBtn').onclick = function () {
            applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        };

        applyTheme(root.getAttribute('data-theme') || 'light');

        /* ===== 数据 ===== */
        var data = [];

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function originOf(u) {
            try { return new URL(u, location.origin).origin; } catch (e) { return ''; }
        }

        /* 图标预览：FA / 图片 / favicon / 首字母，与前台逻辑一致 */
        function renderPreview(el, s) {
            if (!el) return;
            var ic = (s.icon || '').trim();
            var ini = (s.name || '').trim().charAt(0) || '?';

            el.style.setProperty('--c', s.color || '#3385ff');
            el.innerHTML = '';

            if (ic.indexOf('fa-') === 0 || /^fa[srb] /.test(ic)) {
                var i = document.createElement('i');
                i.className = ic.indexOf('fa-') === 0 ? 'fas ' + ic : ic;
                el.appendChild(i);
                return;
            }

            var src = '';
            if (/^(https?:\/\/|\/)/.test(ic)) {
                src = ic;
            } else {
                var o = originOf(s.url || '');
                if (o) src = o + '/favicon.ico';
            }

            if (src) {
                var img = document.createElement('img');
                img.alt = '';
                img.onerror = function () {
                    el.innerHTML = '';
                    el.textContent = ini;
                };
                img.src = src;
                el.appendChild(img);
            } else {
                el.textContent = ini;
            }
        }

        function toast(msg, ok) {            var t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = ok === false ? 'rgba(167, 57, 47, .95)' : 'rgba(46, 70, 79, .94)';
            t.classList.add('show');
            clearTimeout(window._tt);
            window._tt = setTimeout(function () { t.classList.remove('show'); }, 1800);
        }

        /* 图标为空时，先让后端探测一次，再提交 */
        function withAutoIcon(payload, done) {
            if (payload.icon) { done(); return; }
            toast('正在探测图标…');
            fetch('/api/admin/probe-icon?url=' + encodeURIComponent(payload.url))
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d && d.url) payload.icon = d.url;
                    done();
                })
                .catch(function () { done(); });
        }

        function load() {
            fetch('/api/admin/services').then(function (r) { return r.json(); }).then(function (list) {
                data = list;
                render();
            });
        }

        function render() {
            var tb = document.getElementById('rows');
            if (!data.length) {
                tb.innerHTML = '<tr><td colspan="5" style="color:var(--text-soft);font-size:13px;padding:16px 0">还没有服务</td></tr>';
                return;
            }
            tb.innerHTML = data.map(function (s) {
                return '<tr data-id="' + s.id + '" class="' + (s.enabled ? '' : 'disabled-row') + '">' +
                    '<td class="color-cell"><input type="color" class="f-color" value="' + esc(s.color || '#3385ff') + '"></td>' +
                    '<td class="name-cell" data-label="名称"><input type="text" class="f-name" value="' + esc(s.name) + '"></td>' +
                    '<td class="url-cell" data-label="地址"><input type="text" class="f-url" value="' + esc(s.url) + '"></td>' +
                    '<td class="icon-cell" data-label="图标"><div class="icon-field">' +
                    '<span class="icon-preview"></span>' +
                    '<input type="text" class="f-icon" value="' + esc(s.icon || '') + '" placeholder="自动">' +
                    '<button class="ibtn btn-upload" title="上传图标">↑</button>' +
                    '</div></td>' +
                    '<td class="op-cell" data-label="操作"><div class="ops">' +
                    '<span class="drag-handle" title="拖动排序">⠿</span>' +
                    '<button class="ibtn save btn-save" title="保存">✓</button>' +
                    '<button class="ibtn btn-toggle" title="' + (s.enabled ? '隐藏' : '显示') + '">' + (s.enabled ? '◉' : '○') + '</button>' +
                    '<button class="ibtn del btn-del" title="删除">✕</button>' +
                    '</div></td>' +
                    '</tr>';
            }).join('');

            Array.prototype.forEach.call(tb.querySelectorAll('tr'), bindRow);

            /* 拖拽排序（单例初始化，render 重建行不影响实例） */
            if (window.Sortable && !window._rowsSortable) {
                window._rowsSortable = Sortable.create(tb, {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    onEnd: function () {
                        var ids = Array.prototype.map.call(
                            tb.querySelectorAll('tr[data-id]'),
                            function (tr) { return parseInt(tr.getAttribute('data-id'), 10); });
                        /* data 数组按新 DOM 顺序重排 */
                        data.sort(function (a, b) {
                            return ids.indexOf(a.id) - ids.indexOf(b.id);
                        });
                        fetch('/api/admin/reorder', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ids: ids })
                        }).then(function (r) {
                            if (r.ok) toast('排序已保存');
                        }).catch(function () { });
                    }
                });
            }
        }

        function bindRow(tr) {
            var id = parseInt(tr.getAttribute('data-id'), 10);
            var item = data.find(function (x) { return x.id === id; });

            var prevEl = tr.querySelector('.icon-preview');

            function gather() {
                return {
                    name: tr.querySelector('.f-name').value.trim(),
                    url: tr.querySelector('.f-url').value.trim(),
                    color: tr.querySelector('.f-color').value,
                    icon: tr.querySelector('.f-icon').value.trim()
                };
            }

            renderPreview(prevEl, gather());

            ['f-name', 'f-url', 'f-color', 'f-icon'].forEach(function (cls) {
                var inp = tr.querySelector('.' + cls);
                if (!inp) return;
                inp.addEventListener('input', function () { renderPreview(prevEl, gather()); });
                inp.addEventListener('change', function () { renderPreview(prevEl, gather()); });
            });

            tr.querySelector('.btn-save').onclick = function () {
                var payload = {
                    name: tr.querySelector('.f-name').value.trim(),
                    url: tr.querySelector('.f-url').value.trim(),
                    color: tr.querySelector('.f-color').value,
                    icon: tr.querySelector('.f-icon').value.trim()
                };
                if (!payload.name || !payload.url) { toast('名称和地址不能为空', false); return; }

                withAutoIcon(payload, function () {
                    fetch('/api/admin/services/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }).then(function (r) {
                        if (r.ok) { toast('已保存'); load(); } else { toast('保存失败', false); }
                    });
                });
            };

            tr.querySelector('.btn-toggle').onclick = function () {
                fetch('/api/admin/services/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: !item.enabled })
                }).then(function () { toast(item.enabled ? '已隐藏' : '已显示'); load(); });
            };

            tr.querySelector('.btn-del').onclick = function () {
                if (!confirm('删除「' + item.name + '」？')) return;
                fetch('/api/admin/services/' + id, { method: 'DELETE' })
                    .then(function () { toast('已删除'); load(); });
            };

            /* 上传图标 */
            tr.querySelector('.btn-upload').onclick = function () {
                var fi = document.createElement('input');
                fi.type = 'file';
                fi.accept = 'image/png,image/jpeg,image/svg+xml,image/x-icon,image/webp,image/gif';
                fi.onchange = function () {
                    var file = fi.files && fi.files[0];
                    if (!file) return;
                    var fd = new FormData();
                    fd.append('file', file);
                    toast('上传中…');
                    fetch('/api/admin/upload-icon', { method: 'POST', body: fd })
                        .then(function (r) {
                            return r.json().then(function (d) { return { ok: r.ok, d: d }; });
                        })
                        .then(function (res) {
                            if (res.ok && res.d.url) {
                                tr.querySelector('.f-icon').value = res.d.url;
                                renderPreview(prevEl, gather());
                                toast('已上传，记得点保存');
                            } else {
                                toast(res.d.error || '上传失败', false);
                            }
                        })
                        .catch(function () { toast('上传失败', false); });
                };
                fi.click();
            };
        }

        document.getElementById('btnAdd').onclick = function () {
            var payload = {
                name: document.getElementById('newName').value.trim(),
                url: document.getElementById('newUrl').value.trim(),
                color: document.getElementById('newColor').value,
                icon: document.getElementById('newIcon').value.trim()
            };
            if (!payload.name || !payload.url) { toast('名称和地址不能为空', false); return; }

            withAutoIcon(payload, function () {
                fetch('/api/admin/services', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(function (r) {
                    if (r.ok) {
                        toast('已添加');
                        document.getElementById('newName').value = '';
                        document.getElementById('newUrl').value = '';
                        document.getElementById('newIcon').value = '';
                        load();
                    } else {
                        toast('添加失败', false);
                    }
                });
            });
        };

        /* ===== 页面文案 ===== */
        function loadSettings() {
            fetch('/api/settings').then(function (r) { return r.json(); }).then(function (s) {
                document.getElementById('set_poem_en_1').value = s.poem_en_1 || '';
                document.getElementById('set_poem_cn_1').value = s.poem_cn_1 || '';
                document.getElementById('set_poem_en_2').value = s.poem_en_2 || '';
                document.getElementById('set_poem_cn_2').value = s.poem_cn_2 || '';
                document.getElementById('set_signature').value = s.signature || '';
            }).catch(function () { });
        }

        document.getElementById('btnSaveSettings').onclick = function () {
            var payload = {
                poem_en_1: document.getElementById('set_poem_en_1').value.trim(),
                poem_cn_1: document.getElementById('set_poem_cn_1').value.trim(),
                poem_en_2: document.getElementById('set_poem_en_2').value.trim(),
                poem_cn_2: document.getElementById('set_poem_cn_2').value.trim(),
                signature: document.getElementById('set_signature').value.trim()
            };
            fetch('/api/admin/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function (r) {
                if (r.ok) toast('文案已保存'); else toast('保存失败', false);
            }).catch(function () { toast('保存失败', false); });
        };

        load();
        loadSettings();
    </script>
</body>

</html>
